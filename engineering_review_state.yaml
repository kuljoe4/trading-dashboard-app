architecture_decisions:
  - ADR-001: "Pro-Loop Execution Architecture - Separate high-frequency position monitoring (1s) from lower-frequency scanning (15s)."
  - ADR-002: "Tiered Bandwidth WS Broadcaster - Broadcast full updates only to focused tabs; stream thinned deltas to background/unfocused views."
  - ADR-003: "Single-Instance Memory Engine - In-memory KlineStore and TickerCache designed for ultra-low latency under 256MB Node.js heap."
  - ADR-004: "Self-Healing PnL Reconciler - Recompute net P&L on trade closure and auto-correct corrupted accumulated P&L state."
  - ADR-005: "Strict DTO & NestJS Validation Pipe - Mandate Class-Validator constraints with XSS lookaheads and strict query type assertions."

