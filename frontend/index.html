<!doctype html>
<html lang="en">
  <head>
    <script>
      // SRE: Per platform environment constraints (HMR disabled in iFrame), ignore WebSocket / Vite HMR transport errors
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('WebSocket') ||
          msg.includes('vite-hmr') ||
          msg.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + ' ' + (event.filename || '');
        if (
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('WebSocket') ||
          msg.includes('vite-hmr') ||
          msg.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#5b6fff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Momentum Engine</title>
    <meta name="description" content="Resource-lean momentum trading dashboard for Binance USDⓈ-M futures with real-time analytics, risk controls, and automated strategy monitoring." />
    <meta property="og:title" content="Momentum Engine" />
    <meta property="og:description" content="Resource-lean momentum trading dashboard for Binance USDⓈ-M futures with real-time analytics, risk controls, and automated strategy monitoring." />
  </head>
  <body>
    <div id="root">
      <div
        id="boot-shell"
        aria-hidden="true"
        style="min-height:100vh;background:#080b12;color:#f8fafc;display:flex;font-family:'Plus Jakarta Sans',system-ui,sans-serif;"
      >
        <div style="width:260px;background:#0d121f;border-right:1px solid #1c2436;padding:20px;display:none;" class="boot-sidebar">
          <div style="height:36px;width:150px;border-radius:8px;background:#141b2d;margin-bottom:32px;"></div>
          <div style="height:36px;border-radius:8px;background:#141b2d;margin-bottom:8px;"></div>
          <div style="height:36px;border-radius:8px;background:#111728;margin-bottom:8px;"></div>
          <div style="height:36px;border-radius:8px;background:#111728;margin-bottom:8px;"></div>
          <div style="height:36px;border-radius:8px;background:#111728;"></div>
        </div>
        <div style="flex:1;padding:9px 10px 0 10px;max-width:1600px;margin:0 auto;width:100%;" class="boot-main">
          <div style="border-radius:16px 16px 0 0;background:#0d121f;border-bottom:1px solid #1c2436;height:43px;" class="boot-h1"></div>
          <div style="border-radius:0 0 16px 16px;background:#0d121f;border-bottom:1px solid #1c2436;height:26px;margin-bottom:6px;" class="boot-h2"></div>
          <div style="display:none;height:32px;width:146px;border-radius:8px;background:#0d121f;border:1px solid #1c2436;margin-bottom:6px;" class="boot-engine-switch"></div>
          <div class="boot-kpis" style="display:grid;gap:10px;margin-bottom:12px;">
            <div style="height:56px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
            <div style="height:56px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
            <div style="height:56px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
            <div style="height:56px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
          </div>
          <div style="height:176px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
        </div>
      </div>
      <style>
        .boot-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
        @media(min-width:640px){.boot-main{padding:13px 16px 0 16px!important}.boot-h1{height:47px!important}.boot-h2{height:28px!important}.boot-engine-switch{margin-bottom:8px!important}}
        @media(min-width:768px){.boot-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
        @media(min-width:1024px){.boot-sidebar{display:block!important}.boot-main{padding:13px 20px 0 20px!important}.boot-h2{margin-bottom:8px!important}}
      </style>
      <script>
        (function(){
          try {
            var root = document.getElementById('boot-shell');
            if (!root) return;
            if (localStorage.getItem('sidebar_collapsed') === 'true') {
              var sb = root.querySelector('.boot-sidebar');
              if (sb) sb.style.width = '80px';
            }
            if (window.location.search && window.location.search.indexOf('engine=') !== -1) {
              var es = root.querySelector('.boot-engine-switch');
              if (es) es.style.display = 'block';
            }
          } catch (e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
