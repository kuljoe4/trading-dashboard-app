<!doctype html>
<html lang="en">
  <head>
    <script>
      // SRE: Per platform environment constraints (HMR disabled in iFrame), ignore WebSocket / Vite HMR transport errors
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('WebSocket') ||
          msg.includes('vite-hmr') ||
          msg.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event.message || '') + ' ' + (event.filename || '');
        if (
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('WebSocket') ||
          msg.includes('vite-hmr') ||
          msg.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#5b6fff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Momentum Engine</title>
    <meta name="description" content="Resource-lean momentum trading dashboard for Binance USDⓈ-M futures with real-time analytics, risk controls, and automated strategy monitoring." />
    <meta property="og:title" content="Momentum Engine" />
    <meta property="og:description" content="Resource-lean momentum trading dashboard for Binance USDⓈ-M futures with real-time analytics, risk controls, and automated strategy monitoring." />
  </head>
  <body>
    <div id="root">
      <div
        id="boot-shell"
        aria-hidden="true"
        style="min-height:100vh;background:#080b12;color:#f8fafc;display:flex;font-family:'Plus Jakarta Sans',system-ui,sans-serif;"
      >
        <div style="width:260px;background:#0d121f;border-right:1px solid #1c2436;padding:20px;display:none;" class="boot-sidebar">
          <div style="height:36px;width:150px;border-radius:8px;background:#141b2d;margin-bottom:32px;"></div>
          <div style="height:36px;border-radius:8px;background:#141b2d;margin-bottom:8px;"></div>
          <div style="height:36px;border-radius:8px;background:#111728;margin-bottom:8px;"></div>
          <div style="height:36px;border-radius:8px;background:#111728;margin-bottom:8px;"></div>
          <div style="height:36px;border-radius:8px;background:#111728;"></div>
        </div>
        <div style="flex:1;padding:16px 20px;max-width:1600px;margin:0 auto;">
          <div style="height:58px;border-radius:16px;background:#0d121f;border:1px solid #1c2436;margin-bottom:12px;"></div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px;">
            <div style="height:68px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
            <div style="height:68px;border-radius:12px;background:#0d121f;border:1px solid #1c2436;"></div>
          </div>
          <div style="height:176px;border-radius:16px;background:#0d121f;border:1px solid #1c2436;"></div>
        </div>
      </div>
      <style>@media(min-width:1024px){.boot-sidebar{display:block!important}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
