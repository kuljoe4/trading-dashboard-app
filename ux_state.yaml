ux_state:
  last_review: 2026-06-22

findings:
  - id: UX-001
    status: resolved
    severity: medium
    category: hierarchy
    screens:
      - dashboard
    notes: "Dashboard hierarchy needs clarification: safety/risk first, strategy performance second, logs/scanner third."
    recommendation: "Reorganize DashboardView layout to prioritize global risk metrics."

  - id: UX-002
    status: resolved
    severity: high
    category: interaction
    screens:
      - dashboard
    notes: "Replace symbolic text controls (▶, ■) with consistent icons and labels."
    recommendation: "Use Lucide icons and Btn component for all session controls."

  - id: UX-003
    status: resolved
    severity: high
    category: safety
    screens:
      - dashboard
      - global
    notes: "Kill action needs to be prominent but guarded against accidental taps, especially on mobile."
    recommendation: "Implement a confirmation modal or long-press action for the Kill/Terminate button."

  - id: UX-004
    status: resolved
    severity: medium
    category: visualization
    screens:
      - trade-detail
      - active-trade-card
    notes: "Improve active trade 'price runway' so SL, entry, and TP are immediately understandable."
    recommendation: "Enhance ActiveTradeCard with a scale-aware progress bar."

  - id: UX-005
    status: open
    severity: low
    category: components
    screens:
      - all
    notes: "Extract repeated inline styles into reusable components or tokens."
    recommendation: "Standardize primitives.jsx and use Tailwind utility patterns exclusively."

  - id: UX-006
    status: resolved
    severity: medium
    category: consistency
    screens:
      - scanner
      - history
    notes: "Define consistent data table/list behavior for scanner and logs."
    recommendation: "Standardize row density and padding across ScannerPreview, ScannerOverlay, and DecisionLog."

  - id: UX-007
    status: resolved
    severity: medium
    category: accessibility
    screens:
      - config-modal
      - primitives
    notes: "Add accessible hover, focus, keyboard, and disabled states for all controls."
    recommendation: "Ensure Radix primitives are used with full accessibility features enabled. Add aria-busy and better focus rings."

  - id: UX-008
    status: resolved
    severity: medium
    category: visibility
    screens:
      - all
    notes: "Paper Mode must be visually unmistakable across the whole UI."
    recommendation: "Added amber border/badge for Paper Mode across the dashboard."

  - id: UX-009
    status: open
    severity: medium
    category: information-architecture
    screens:
      - dashboard
    notes: "StrategyCard and StrategyDetailView feel like different objects. Card should be a zoomable version of the detail."
    recommendation: "Align component architecture so StrategyCard shares sub-components with StrategyDetailView (e.g. Stats, ScannerPreview)."

  - id: UX-010
    status: open
    severity: high
    category: interaction
    screens:
      - config-modal
    notes: "ConfigModal tabbed interface hides critical risk settings while configuring scanner. Users might miss sizing implications."
    recommendation: "Add a persistent 'Risk Summary' sidebar or footer to ConfigModal that updates live as scanner/risk params change."

  - id: UX-011
    status: resolved
    severity: medium
    category: accessibility
    screens:
      - dashboard
    notes: "StrategyCard onClick navigates to detail, but there are nested interactive buttons (Edit, Pause, Expand). This can cause accidental navigation."
    recommendation: "Use e.stopPropagation() more rigorously on all sub-controls in StrategyCard."

  - id: UX-012
    status: open
    severity: medium
    category: accessibility
    screens:
      - active-trade-card
    notes: "ActiveTradeCard Price Runway lacks semantic descriptions for screen readers. The 'progress' of a trade is only conveyed visually."
    recommendation: "Add aria-valuenow, aria-valuemin, aria-valuemax to the progress bar and provide a text description of the trade status."

  - id: UX-013
    status: open
    severity: low
    category: responsive
    screens:
      - scanner
    notes: "ScannerOverlay uses a dense grid that is truncated on mobile. Volume and Score are hidden, which is good, but the layout shift between mobile/desktop headers is jarring."
    recommendation: "Standardize the row height and use a more flexible flexbox/grid layout."

  - id: UX-014
    status: resolved
    severity: low
    category: interaction
    screens:
      - active-trade-card
    notes: "ActiveTradeCard uses scale-[0.98] on active, which is good feedback, but lacks a focus ring for keyboard navigation."
    recommendation: "Add 'focus-visible:ring-2 focus-visible:ring-accent' to ActiveTradeCard."

  - id: UX-015
    status: open
    severity: medium
    category: state-integrity
    screens:
      - all
    notes: "WebSocket delta updates rely on `_delta` and `_thin` flags. Field omission during delta may cause UI flicker."
    recommendation: "Strictly enforce field preservation in `normalizeTrade`."

  - id: UX-016
    status: open
    severity: low
    category: performance
    screens:
      - scanner
    notes: "ScannerOverlay re-renders every 200ms during high volatility. Functional components inside the map might cause GC pressure."
    recommendation: "Memoize individual scanner row components."

  - id: UX-017
    status: resolved
    severity: low
    category: visual
    screens:
      - all
    notes: "Double negative in fmtUSD: negative performance displays both a down arrow and a minus sign (e.g. ▾ -$10.00)."
    recommendation: "Refine fmtUSD to only use arrows for direction without preparation of a redundant minus sign."

  - id: UX-018
    status: open
    severity: low
    category: responsive
    screens:
      - active-trade-bar
    notes: "Mobile layout overlap risk for ActiveTradeBar in floating state."
    recommendation: "Add padding or adjust z-index/bottom offset for small screens."

  - id: UX-019
    status: open
    severity: medium
    category: information-architecture
    screens:
      - config-modal
    notes: "RR Sequence configuration is separated from other Risk settings, causing fragmentation in the mental model of trade protection."
    recommendation: "Cross-link or mirror RR Sequence preview in the Risk tab."

  - id: UX-020
    status: open
    severity: low
    category: accessibility
    screens:
      - active-trade-card
    notes: "Recon badge uses low-contrast amber text which might fail accessibility checks in specific light modes."
    recommendation: "Increase contrast ratio for status badges."

design_decisions:
  - DD-001: "Operator Cockpit vision - prioritize information density and real-time awareness over marketing aesthetics."
  - DD-002: "WebSocket-first data flow with delta merging to minimize network egress while keeping UI fresh."
  - DD-003: "Eco Mode - throttle updates and background tasks when tab is inactive to preserve system resources."
  - DD-004: "Zustand for state management to ensure atomic updates across related components."

metrics:
  overall_score: 9.0
  task_completion_rate: 0.92
  accessibility_issues_open: 2
  total_open_findings: 10
  performance_score_lighthouse: 98
  ws_latency_avg_ms: 115
